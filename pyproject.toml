[tool.poetry]
name = "game-news-site"
version = "0.1.0"
description = "News Site"
repository = "https://www.github.com/Zontax/game-news-site"
readme = "README.md"
authors = ["Zontax <jrvadim04@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
django = "4.2.11"
djangorestframework = "^3.15.2"
markdown = "^3.6"
django-filter = "^24.2"
gunicorn = "^22.0.0"
psycopg2 = "^2.9.9"
django-environ = "^0.11.2"
django-debug-toolbar = "^4.4.2"
django-extensions = "^3.2.3"
django-recaptcha = "^4.0.0"
django-phonenumber-field = "^7.3.0"
phonenumbers = "^8.13.39"
humanize = "^4.9.0"
mimesis = "^17.0.0"
bleach = "^6.1.0"
celery = "^5.4.0"
pytils = "^0.4.1"
termcolor = "^2.4.0"
beautifulsoup4 = "^4.12.3"
drf-spectacular = "^0.27.2"
pyyaml = "^6.0.1"
redis = "^5.0.6"
django-admin-extra-buttons = "^1.5.8"
werkzeug = "^3.0.3"
httpie = "^3.2.2"
flower = "^2.0.1"
django-import-export = "^4.1.1"
django-image-uploader-widget = "^0.5.0"
reportlab = "^4.2.2"
django-silk = "^5.1.0"
django-ckeditor-5 = "^0.2.15"
django-colorfield = "^0.11.0"
social-auth-app-django = "^5.4.2"
django-celery-beat = "^2.7.0"

django-celery-results = "^2.5.1"
user-agents = "^2.2.0"
[tool.poetry.dev-dependencies]
pytest = "8.2.2"
selenium = "^4.22.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
somecommand = "src.main:run"
